# AFWC Board — Cloudflare Worker configuration.
#
# Everything here is runnable OFFLINE: `wrangler dev --local` boots workerd with
# miniflare's local D1 (SQLite under .wrangler/state). No Cloudflare account is
# required to develop, and `database_id` below is the group's real database.
#
# Paths are relative to THIS file (worker/), which is why the assets directory
# reaches back up to the shared ../public that the Express app also serves.
#
# =============================================== ONE BINDING, ON PURPOSE ==========
# D1 is the whole backend. It holds the rows AND, since migration 0003, the
# FILES — draft originals and page images, off-site event attachments, chat
# attachments — as chunked BLOB rows (worker/src/services/filestore.js).
#
# There used to be an [[r2_buckets]] block here. It is gone, and the reason is
# worth keeping written down so nobody helpfully adds it back: enabling R2 on a
# Cloudflare account requires a payment method on file, even though this app's
# usage would bill $0 forever. This board is owned by a shared mailbox and
# handed on with it, and "whoever currently holds the mailbox also has a card on
# this account" is not a thing that survives a change of leadership. D1's 5 GB
# free tier needs no card at all. One backend, no billing profile, nothing to
# create on deploy day beyond the database itself.
#
# The trade is real and is managed rather than ignored: files are chunked to fit
# D1's row limit, and a RETENTION POLICY (settings.file_retention_days, swept by
# the daily Cron Trigger below) keeps the 5 GB ceiling far away. See
# worker/src/services/retention.js and README.md.
#
# DEPLOY DAY TOUCHES ONE THING IN THIS FILE: [[d1_databases]] database_id below,
# already filled in. The full copy-paste sequence — create the DB, paste the
# UUID here, set the SETUP_TOKEN secret, apply migrations remotely, deploy — is
# README.md's DEPLOY-DAY CHECKLIST.
# ===================================================================================

name = "afwc-board"                  # ← FINAL. Matches database_name below; also
                                      #   becomes the *.workers.dev subdomain
                                      #   (see workers_dev).
main = "dist/index.js"
compatibility_date = "2026-08-01"    # ← FINAL for this build. Bump only alongside a
                                      #   deliberate re-test against a newer Workers
                                      #   runtime — never drift it forward by habit.
# nodejs_compat: sanitize-html's dependency graph (htmlparser2, postcss) reaches
# for a handful of node builtins. The flag costs nothing and keeps the bundle
# honest rather than shimming them by hand.
compatibility_flags = ["nodejs_compat"]

# workers_dev = true — DECIDED, KEPT: this app ships at the free
# afwc-board.<subdomain>.workers.dev URL with no custom domain (see
# PORT-CLOUDFLARE.md "Ownership / deploy model" — that free URL is the whole
# point of this plan). No [[routes]] block exists because there is no custom
# domain to route from. Revisit only if the group ever buys a domain and wants
# it fronting the site instead; until then this is the deploy target, not a
# placeholder.
workers_dev = true

# ------------------------------------------------------------- observability --
# Workers Logs, on by default on the free plan at no cost — `console.log`/
# `console.error` calls throughout this codebase (the cron jobs in
# worker/src/scheduled.js are the heaviest users) become queryable in the
# dashboard and `wrangler tail` without any extra wiring. There is no sampling
# knob worth setting for an app this size; every invocation is cheap to keep.
[observability]
enabled = true

# ------------------------------------------------------------------ triggers --
# Three Cron Triggers (free on every plan — this is the one piece of "ops"
# infrastructure that costs nothing at any scale). worker/src/scheduled.js
# dispatches on the exact string below via `event.cron`, so a change here MUST
# be mirrored in that file's JOBS table or the new schedule fires into a
# console.warn and does nothing.
#   */15 * * * *   sweeps: stale-processing drafts (>10 min untouched),
#                  expired sessions, expired time-boxed leader roles, elapsed
#                  rate-limit rows. All four were either boot-time-only or
#                  interval-only on the Express/Node stack; a Worker has
#                  neither, so they move to the highest-frequency schedule
#                  Cloudflare's free plan allows.
#   0 9 * * *      daily: the FILE RETENTION SWEEP (the only scheduled job in
#                  this app that deletes anything a member can see — its
#                  policy is written out at length in
#                  worker/src/services/retention.js), then the integrity
#                  report it feeds: file-store size, soft-deleted-message
#                  attachment counts, a #general-channel duplicate check,
#                  written to a settings row.
#   0 9 1 * *      monthly backup CHECK. This used to write a D1 → R2 snapshot.
#                  There is no bucket any more, so there is no second copy for
#                  a cron to make and this job does not pretend otherwise: it
#                  refreshes the numbers /admin/backup shows and stamps
#                  settings.last_snapshot_at. THE LEADER'S DOWNLOAD IS THE
#                  BACKUP — see worker/src/services/backup.js.
# All three times are UTC, same as every other timestamp this app stores;
# 09:00 UTC is 04:00/05:00 America/New_York depending on DST — deliberately
# outside anyone's session.
[triggers]
crons = ["*/15 * * * *", "0 9 * * *", "0 9 1 * *"]

# ------------------------------------------------------------------- limits --
# No [limits] block: the free plan's per-invocation CPU budget (~10ms) is not
# a wrangler.toml setting, it is enforced by the platform and is the number
# every CPU-conscious comment in this codebase (PORT-CLOUDFLARE.md §6, the CPU
# BUDGET section of worker/src/services/backup.js, worker/src/routes/drafts.js's
# MAX_BATCH_BYTES/MAX_PAGES_PER_BATCH) is written against. Three D1-shaped
# numbers worth knowing instead, because they change how much data this app
# can hold before something here needs revisiting rather than how fast a
# single request runs:
#   * D1 free tier: 5 GB stored, 5M rows read + 100k rows written per day.
#     THIS IS NOW THE FILE-STORAGE CEILING TOO, which is why the retention
#     policy exists. A volunteer writing group's board — sub-megabyte prose
#     drafts, a few small attachments, a year's window — is nowhere near it.
#   * D1 row limit: 2 MB. That is what sets CHUNK_BYTES (1,000,000) in
#     worker/src/services/filestore.js: a file is chunked into rows, and each
#     chunk sits at half the ceiling with room for the rest of the row.
#   * Blob → SQL text costs ~5.7 ms of CPU per megabyte, which is most of a
#     request's budget. That is why the backup download inlines a small file
#     store and paginates a larger one, rather than trying and failing.
# Revisit if the group's membership or draft volume grows by an order of
# magnitude; nothing here needs pre-emptive tuning at today's scale.

# ---------------------------------------------------------------- database --
[[d1_databases]]
binding = "DB"
database_name = "afwc-board"
# The group's real database, from `wrangler d1 create afwc-board`. Rows AND
# files — see the "ONE BINDING, ON PURPOSE" note at the top of this file.
database_id = "dc9e487d-2e88-4b5b-bc4d-1884cbde267e"
migrations_dir = "migrations"

# ------------------------------------------------------------------ files --
# There is no binding for these — they are rows. Off-site event attachments
# (P2), draft originals and page images (P4), chat attachments (P3/P4) all live
# in stored_files + file_chunks, addressed by (scope, ref_id, stored_name)
# instead of an object key:
#     ('events', <meetingId>, <stored_name>)   worker/src/services/events/attachments.js
#     ('drafts', <draftId>,   'original.docx' | 'pages/0001.png')
#                                              worker/src/services/drafts/attachments.js
#     ('chat',   <messageId>, <stored_name>)   worker/src/services/chat/attachments.js
# Addresses are always BUILT from a validated id plus a name the app generated;
# see the pattern notes at the top of worker/src/services/filestore.js and of
# each attachments module. Nothing has a public URL — every byte leaves through
# an authorized Worker route, and every one of those routes is requireMember or
# stricter.

# ----------------------------------------------------------------- secrets --
# SETUP_TOKEN (optional, set with `npx wrangler secret put SETUP_TOKEN`, NOT
# declared here because secrets never belong in a committed config): the
# one-time bootstrap code for /setup. When it is present and the users table is
# still empty, the first-run form demands it, so a freshly deployed board on a
# public URL cannot be claimed by whoever finds it first. It is inert the moment
# an account exists — /setup hard-404s from then on — and can be deleted after
# setup. Absent (local dev), /setup behaves exactly as it always has.
# See worker/src/routes/auth.js and README.md's DEPLOY-DAY CHECKLIST.

# ------------------------------------------------------------------ assets --
# public/ is shared verbatim with the Express app.
#
# run_worker_first = true is deliberate. The Express app applies its security
# headers BEFORE express.static (src/app.js), so every response — stylesheet,
# script, image — carries nosniff/Referrer-Policy/X-Frame-Options/CSP. Letting
# the assets layer answer first would silently drop those headers on exactly the
# files an attacker would most like to have sniffed. The Worker therefore sees
# every request, sets the headers, and hands file-shaped paths to env.ASSETS.
[assets]
directory = "../public"
binding = "ASSETS"
run_worker_first = true
