name: Deploy

# Push-to-deploy: build the Worker, check view parity, then ship it. The
# secret this depends on (CLOUDFLARE_API_TOKEN) doesn't exist until the
# group's Cloudflare account does — see the "guard" step below and the
# DEPLOY-DAY CHECKLIST in README.md. Until then this workflow still runs
# `npm ci` + build + parity on every push, so a broken build is caught even
# before there's anything to deploy to.

on:
  push:
    branches: [main]

# Only one deploy in flight at a time; a second push while one is running
# waits rather than racing it against a second `wrangler deploy`.
concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  build:
    name: Build & verify
    runs-on: ubuntu-latest
    outputs:
      has_token: ${{ steps.check-secret.outputs.has_token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Build the Worker (esbuild + compiled EJS views)
        run: npm run worker:build

      - name: Check view parity (Express views vs. Worker-compiled views)
        run: npm run worker:parity:views

      # Deploying needs the group's own Cloudflare account, which does not
      # exist on day one of this repo. Rather than fail the whole workflow
      # on a missing secret, this step just records whether it's there yet
      # and the two deploy jobs below skip themselves with a friendly notice
      # when it's absent — see README.md's DEPLOY-DAY CHECKLIST for how a
      # leader adds it once the account is created.
      - name: Check for CLOUDFLARE_API_TOKEN
        id: check-secret
        run: |
          if [ -n "${{ secrets.CLOUDFLARE_API_TOKEN }}" ]; then
            echo "has_token=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_token=false" >> "$GITHUB_OUTPUT"
            echo "::notice::CLOUDFLARE_API_TOKEN is not set yet — build/parity ran, but the deploy steps are skipped. See README.md's DEPLOY-DAY CHECKLIST to add it once the group's Cloudflare account exists."
          fi

  migrate:
    name: Apply D1 migrations (remote)
    needs: build
    if: needs.build.outputs.has_token == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # Applies any migration under worker/migrations/ not yet recorded as
      # applied on the REMOTE database — safe to run on every deploy, since
      # an already-applied migration is a no-op. `--remote` is the one flag
      # that makes this touch the real database instead of local state.
      - name: wrangler d1 migrations apply --remote
        run: npx wrangler d1 migrations apply DB --remote --config worker/wrangler.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

  deploy:
    name: Deploy to Cloudflare Workers
    needs: [build, migrate]
    if: needs.build.outputs.has_token == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Build the Worker
        run: npm run worker:build

      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: worker
          # The build step above already produced dist/index.js from the repo
          # root's npm scripts; wrangler-action's own install/build stays out
          # of the way via --no-bundle since esbuild already did that work.
          command: deploy --no-bundle

  no-token-notice:
    name: Deploy skipped (no token yet)
    needs: build
    if: needs.build.outputs.has_token == 'false'
    runs-on: ubuntu-latest
    steps:
      - name: Explain why nothing deployed
        run: |
          {
            echo "## Deploy skipped"
            echo ""
            echo "Build and view-parity checks passed, but no CLOUDFLARE_API_TOKEN repo secret exists yet, so nothing was deployed. This is expected before the group's Cloudflare account is set up. See README.md's DEPLOY-DAY CHECKLIST."
          } >> "$GITHUB_STEP_SUMMARY"
